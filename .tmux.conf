# 把前缀键从 Ctrl+B 改成 Ctrl+A（更顺手）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 用 | 和 - 分屏（更直观）
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新建窗口时保持当前路径
bind c new-window -c "#{pane_current_path}"

# Alt+方向键 切换分屏（不需要前缀键）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 开启鼠标支持（点击切换分屏、拖拽调整大小、滚轮翻页）
set -g mouse on

# 窗口编号从 1 开始（0 离得太远）
set -g base-index 1
setw -g pane-base-index 1

# 256 色支持
#set -g default-terminal "screen-256color"

# 增大历史记录
#set -g history-limit 50000

# 减少 ESC 延迟（对 vim 用户很重要）
#set -sg escape-time 10

# 状态栏美化
set -g status-style 'bg=#333333 fg=#ffffff'
set -g status-left ' #S '
set -g status-right ' %H:%M '

# 快捷键 r 重新加载配置
bind r source-file ~/.tmux.conf \; display-message "配置已重载"

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'     # 一组通用合理默认
set -g @plugin 'tmux-plugins/tmux-resurrect'    # 保存/恢复 session（含 vim / ssh）
set -g @plugin 'tmux-plugins/tmux-continuum'    # 每 15 min 自动 resurrect

set -g @continuum-restore 'on'                  # tmux 启动时自动恢复

run '~/.tmux/plugins/tpm/tpm'             # 必须在最后一行

